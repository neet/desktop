---
# https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_loops.html#extended-loop-variables
- name: "Install AUR package: {{ aur_name }}"
  vars:
    aur_base: "{{ ansible_facts['user_dir'] }}/.cache/aur"
    aur_workdir: "{{ aur_base }}/{{ aur_name }}"

  block:
    - name: "Ensure AUR is cloned"
      ansible.builtin.git:
        repo: https://aur.archlinux.org/{{ aur_name }}.git
        dest: "{{ aur_workdir }}"
        version: "{{ aur_version }}"

    # TODO: 後続のタスクのために「インストールがあったなら changed」にしたい
    - name: "Ensure AUR is built and installed"
      changed_when: false
      ansible.builtin.command:
        chdir: "{{ aur_workdir }}"
        cmd: "makepkg -si --noconfirm --needed"

