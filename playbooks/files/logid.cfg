devices: (
  {
    name: "MX Master 3S";
    dpi: 1500;

    // https://github.com/PixlOne/logiops/issues/116
    hiresscroll: {
      hires: true;
      invert: false;
      target: false;
    }

    buttons: (
      {
        cid: 0x53;
        action: {
          type: "Keypress";
          keys: ["KEY_BACKSPACE"];
        };
      },
      {
        cid: 0x56;
        action: {
          type: "Keypress";
          keys: ["KEY_ENTER"];
        };
      },
      {
        cid: 0xc3;
        action: {
          type: "Gestures";
          gestures: (
            {
              direction: "Left";
              mode: "onInterval";
              interval: 500;
              action: {
                type: "Keypress";
                keys: ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_RIGHT"];
              };
            },
            {
              direction: "Right";
              mode: "onInterval";
              interval: 500;
              action: {
                type: "Keypress";
                keys: ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_LEFT"];
              };
            }
          );
        };
      },
      {
        cid: 0xc4;
        action: {
          type: "Keypress";
          keys: ["KEY_LEFTCTRL", "KEY_W"];
        };
      }
    );
  }
);
