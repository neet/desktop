---
- name: Prepare Desktop
  hosts: localhost
  tasks:
    ################################################################################
    # 環境変数
    ################################################################################
    - name: Ensure environment is copied
      become: true
      ansible.builtin.copy:
        src: environment
        dest: /etc/environment
        mode: "0644"

    - name: Ensure locales are enabled
      become: true
      community.general.locale_gen:
        name:
        - "en_US.UTF-8"

    ################################################################################
    # ネットワークまわり
    ################################################################################
    - name: Ensure networkmanager is installed
      become: true
      community.general.pacman:
        name: networkmanager

    - name: Ensure networkmanager is enabled
      become: true
      ansible.builtin.service:
        name: NetworkManager 
        enabled: true
        state: started

    ################################################################################
    # ユーザーを作る
    ################################################################################
    - name: Ensure sudo is installed
      become: true
      community.general.pacman:
        name: sudo

    - name: Ensure user is created
      become: true
      ansible.builtin.user:
        name: "{{ user_name }}"
        password: "{{ user_password }}" 
        groups: wheel
        append: yes
        update_password: on_create

    - name: Ensure wheel group can sudo
      become: true
      community.general.sudoers:
        name: wheel
        group: wheel
        runas: ALL:ALL
        commands: ALL
        nopassword: false
    
    ################################################################################
    # 開発環境のセットアップ
    ################################################################################
    - name: Ensure Neovim and related packages are installed
      become: true
      community.general.pacman:
        name:
          - neovim
          - gcc
          - ghq
          - direnv
          - tree-sitter-cli

    ################################################################################
    # Bluetooth のセットアップ
    ################################################################################
    - name: Ensure Bluetooth related packages are installed
      become: true
      community.general.pacman:
        name:
          - bluez
          - bluez-utils

    - name: Ensure bluetooth is enabled
      become: true
      ansible.builtin.service:
        name: bluetooth
        enabled: true
        state: started

    ################################################################################
    # GUI のセットアップ
    ################################################################################
    - name: Ensure GNOME is installed
      become: true
      community.general.pacman:
        name: gnome

    ################################################################################
    # AUR のインストール
    ################################################################################
    - name: Ensure 1Password is cloned from AUR
      ansible.builtin.git:
        repo: https://aur.archlinux.org/1password.git
        dest: "{{ ansible_facts['user_dir'] }}/.cache/aur/1password" 
        version: d991324ae2605a3142318cd33fe3d7da6a9f98eb

    - name: Ensure 1Password package is registered to a variable
      register: packagelist
      ansible.builtin.command:
        chdir: "{{ ansible_facts['user_dir'] }}/.cache/aur/1password"
        cmd: "makepkg --packagelist"
      changed_when: false

    - name: Ensure 1Password is built
      ansible.builtin.command:
        chdir: "{{ ansible_facts['user_dir'] }}/.cache/aur/1password"
        cmd: "makepkg -s"
        creates: "{{ packagelist.stdout }}"

    - name: Ensure 1Password is installed
      become: true
      community.general.pacman:
        name: "{{ packagelist.stdout }}"
