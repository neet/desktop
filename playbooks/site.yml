---
- name: Prepare Desktop
  hosts: localhost

  handlers:
    - name: Restart Xremap
      become: true
      ansible.builtin.service:
        name: xremap 
        scope: user
        state: restarted
        daemon_reload: true

    - name: Restart logid
      become: true
      ansible.builtin.service:
        name: logid 
        state: restarted

  tasks:
    ################################################################################
    # 環境変数
    ################################################################################
    - name: Ensure environment is copied
      become: true
      ansible.builtin.copy:
        src: environment
        dest: /etc/environment
        mode: "0644"

    - name: Ensure locales are enabled
      become: true
      community.general.locale_gen:
        name:
        - "en_US.UTF-8"

    ################################################################################
    # ネットワークまわり
    ################################################################################
    - name: Ensure networkmanager is prepared
      become: true
      block:
        - name: Ensure networkmanager is installed
          community.general.pacman:
            name: networkmanager

        - name: Ensure networkmanager is enabled
          ansible.builtin.service:
            name: NetworkManager 
            enabled: true
            state: started

    ################################################################################
    # ユーザーを作る
    ################################################################################
    - name: Ensure user is prepared
      become: true
      block:
        - name: Ensure sudo is installed
          community.general.pacman:
            name: sudo

        - name: Ensure user is created
          ansible.builtin.user:
            name: "{{ user_name }}"
            password: "{{ user_password }}" 
            groups:
              - wheel
              - input
            append: yes
            update_password: on_create

        - name: Ensure wheel group can sudo
          community.general.sudoers:
            name: wheel
            group: wheel
            runas: ALL:ALL
            commands: ALL
            nopassword: false
    
    ################################################################################
    # 開発環境のセットアップ
    ################################################################################
    - name: Ensure Neovim and related packages are installed
      become: true
      community.general.pacman:
        name:
          - direnv
          - fzf
          - gcc
          - ghq
          - git
          - jq
          - lazygit
          - less
          - lua-language-server
          - neovim
          - nodejs
          - npm
          - ripgrep
          - rust
          - tmux
          - tree-sitter-cli
          - typescript-language-server
          - zsh-autosuggestions
          - zsh-syntax-highlighting

    ################################################################################
    # Bluetooth のセットアップ
    ################################################################################
    - name: Ensure Bluetooth is prepared
      become: true
      block:
        - name: Ensure Bluetooth related packages are installed
          community.general.pacman:
            name:
              - bluez
              - bluez-utils

        - name: Ensure bluetooth is enabled
          ansible.builtin.service:
            name: bluetooth
            enabled: true
            state: started

    ################################################################################
    # GUI のセットアップ
    ################################################################################
    - name: Ensure GNOME and related packages are installed
      become: true
      community.general.pacman:
        name:
        - alacritty
        - discord
        - firefox
        - gnome
        - anki

    ################################################################################
    # AUR のインストール
    ################################################################################
    - name: Ensure AUR packages are prepared
      block:
        # makepkg に become 付けたら怒られるのでどうすればいいのやら。
        - name: Ensure AUR dependencies are explicitly installed
          become: true
          community.general.pacman:
            name:
              # logiops の依存
              - cmake
              - libconfig

        - name: Ensure AUR packages are installed
          ansible.builtin.include_tasks: aur.yml
          vars:
            aur_name: "{{ item.key }}"
            aur_version: "{{ item.value }}"
          with_dict:
            1password: d991324ae2605a3142318cd33fe3d7da6a9f98eb
            ibus-mozc: 25a9f3c5a69617b04330c0efe8fc6cb2c98870fc 
            logiops: 1458d302ec8b529cfb1dbc5937f284f3a95240ce
            mozc: 53a13d01af98e3e08f35c49b441cc0fafdaea86f
            slack-desktop: 1275d6840eb7998cd94ae5d1ea7687c2b219f6e6 
            vscode-langservers-extracted: 6a5dd717ba64ba85fbaed3f33e34f3184a127b44
            zsh-pure-prompt: 6b8c56e594d4a3c53c9bc68d08e1fa64c8fe2648

    ################################################################################
    # Logiops のインストール
    ################################################################################
    - name: Ensure Logiops is prepared
      notify: Restart logid
      become: true
      block:
        - name: Ensure logid is enabled
          ansible.builtin.service:
            name: logid
            enabled: true
            state: started

        - name: Ensure logid config is copied
          ansible.builtin.copy:
            src: logid.cfg
            dest: /etc/logid.cfg
            mode: "0644"

    ################################################################################
    # Xremap のインストール
    ################################################################################
    - name: Ensure Xremap is prepared
      notify: Restart Xremap
      block:
        - name: Ensure Xremap is installed
          community.general.cargo:
            name: xremap
            version: 0.10.7
            features: [gnome]

        - name: Ensure Xremap config is copied
          ansible.builtin.copy:
            src: xremap.yaml
            dest: "{{ ansible_facts['user_dir'] }}/.config/xremap.yaml"
            mode: "0644"

        - name: Ensure input group can create output devices
          become: true
          ansible.builtin.copy:
            src: 99-input.rules
            dest: /etc/udev/rules.d/99-input.rules
            mode: "0644"

        - name: Ensure Xremap service exists
          ansible.builtin.copy:
            src: xremap.service
            dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/xremap.service"
            mode: "0644"

        - name: Ensure Xremap is enabled
          ansible.builtin.service:
            name: xremap 
            scope: user
            enabled: true
            state: started
