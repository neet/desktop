---
- name: Prepare Desktop
  hosts: localhost
  become: true
  tasks:
    ################################################################################
    # 環境変数
    ################################################################################
    - name: Ensure environment is copied
      ansible.builtin.copy:
        src: environment
        dest: /etc/environment
        mode: "0644"

    - name: Ensure locales are enabled
      community.general.locale_gen:
        name:
        - "en_US.UTF-8"

    ################################################################################
    # ネットワークまわり
    ################################################################################
    - name: Ensure networkmanager is installed
      community.general.pacman:
        name: networkmanager

    - name: Ensure networkmanager is enabled
      ansible.builtin.service:
        name: NetworkManager 
        enabled: true
        state: started

    ################################################################################
    # ユーザーを作る
    ################################################################################
    - name: Ensure sudo is installed
      community.general.pacman:
        name: sudo

    - name: Ensure user is created
      ansible.builtin.user:
        name: "{{ user_name }}"
        password: "{{ user_password }}" 
        groups: wheel
        append: yes
        update_password: on_create

    - name: Ensure wheel group can sudo
      community.general.sudoers:
        name: wheel
        group: wheel
        runas: ALL:ALL
        commands: ALL
        nopassword: false
    
    ################################################################################
    # 開発環境のセットアップ
    ################################################################################
    - name: Ensure Neovim and related packages are installed
      community.general.pacman:
        name:
          - neovim
          - gcc
          - ghq
          - direnv
          - tree-sitter-cli

    ################################################################################
    # Bluetooth のセットアップ
    ################################################################################
    - name: Ensure Bluetooth related packages are installed
      community.general.pacman:
        name:
          - bluez
          - bluez-utils

    - name: Ensure bluetooth is enabled
      ansible.builtin.service:
        name: bluetooth
        enabled: true
        state: started

    ################################################################################
    # GUI のセットアップ
    ################################################################################
    - name: Ensure GNOME is installed
      community.general.pacman:
        name: gnome
