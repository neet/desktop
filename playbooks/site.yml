---
- name: Prepare Desktop
  hosts: localhost
  become: true
  tasks:
    ################################################################################
    # 環境変数
    ################################################################################
    - name: Ensure environment is copied
      ansible.builtin.copy:
        src: environment
        dest: /etc/environment
        mode: "0644"

    ################################################################################
    # ネットワークまわり
    ################################################################################
    - name: Ensure networkmanager is installed
      community.general.pacman:
        name: networkmanager

    - name: Ensure networkmanager is enabled
      ansible.builtin.service:
        name: NetworkManager 
        enabled: true
        state: started

    ################################################################################
    # ユーザーを作る
    ################################################################################
    - name: Ensure sudo is installed
      community.general.pacman:
        name: sudo

    # TODO: `password` を付けて呼ぶようにする
    - name: Ensure user neet is created
      ansible.builtin.user:
        name: neet
        groups: wheel
        append: yes

    - name: Ensure wheel group can sudo
      community.general.sudoers:
        name: wheel
        group: wheel
        runas: ALL:ALL
        commands: ALL
        nopassword: false
    
    # TODO: ここの手順2をやる
    # https://wiki.archlinux.jp/index.php/%E3%83%AD%E3%83%BC%E3%82%AB%E3%83%AA%E3%82%BC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3#%E3%83%AD%E3%82%B1%E3%83%BC%E3%83%AB

    ################################################################################
    # 開発環境のセットアップ
    ################################################################################
    - name: Ensure Neovim and related packages are installed
      community.general.pacman:
        name:
          - neovim
          - gcc
          - ghq
          - direnv
          - tree-sitter-cli

    ################################################################################
    # Bluetooth のセットアップ
    ################################################################################
    - name: Ensure Bluetooth related packages are installed
      community.general.pacman:
        name:
          - bluez
          - bluez-utils

    - name: Ensure bluetooth is enabled
      ansible.builtin.service:
        name: bluetooth
        enabled: true
        state: started

    ################################################################################
    # GUI のセットアップ
    ################################################################################
    - name: Ensure GNOME is installed
      community.general.pacman:
        name: gnome
